<body class="gate-page">
  <a class="gate-skip" href="#gate-content">Skip to content / 跳到内容</a>
  <main class="gate-shell">
    <header class="gate-header"><a class="gate-brand" href="/">Qiushi Xie <span>谢秋实</span></a><div id="gate-navigation"></div></header>
    <section id="gate-content" class="gate-content" aria-labelledby="gate-page-title">
      <div class="gate-section-heading"><h1 id="gate-page-title" data-copy="label"></h1><p data-copy="description"></p></div>
      <div class="gate-card">
        <div class="gate-emblem" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><rect x="11" y="21" width="26" height="22" rx="5" stroke="currentColor" stroke-width="2.2"/><path d="M16 21v-7a8 8 0 0 1 16 0v7" stroke="currentColor" stroke-width="2.2"/><circle cx="24" cy="31" r="2" fill="currentColor"/><path d="M24 33v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div class="gate-tag" data-copy="tag"></div>
        <h2 data-copy="heading"></h2>
        <p class="gate-intro" data-copy="intro"></p>
        <form id="access-form">
          <label for="access-password" data-copy="password"></label>
          <div class="gate-field"><input id="access-password" name="password" type="password" autocomplete="current-password" required maxlength="256" aria-describedby="access-message"><button id="access-show" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <p id="access-message" role="status" aria-live="polite"></p>
          <button class="gate-submit" type="submit"><span data-copy="unlock"></span><span aria-hidden="true">→</span></button>
        </form>
        <p class="gate-remember"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="10" cy="10" r="7.3"/><path d="M10 5.5V10l3 2"/></svg><span data-copy="remember"></span></p>
        <noscript><p data-copy="noscript"></p></noscript>
      </div>
      <a id="gate-return" class="gate-return" href="/"><span aria-hidden="true">←</span><span data-copy="return"></span></a>
    </section>
    <footer class="gate-footer">Qiushi Xie · 谢秋实</footer>
  </main>
  <script id="gate-payload" type="application/json"></script>
