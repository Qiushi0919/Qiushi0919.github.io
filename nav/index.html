<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="谢秋实的个人主页、项目网站、服务器工具与互动页面导航。">
  <title>站点导航 · 谢秋实</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-soft: #f1f4f8;
      --text: #172332;
      --muted: #64748b;
      --faint: #94a3b8;
      --line: #dfe5ec;
      --accent: #1769d2;
      --accent-soft: #eaf3ff;
      --shadow: 0 8px 28px rgba(28, 47, 69, 0.06);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111820;
      --panel: #17212b;
      --panel-soft: #1d2935;
      --text: #edf3f8;
      --muted: #a6b3c1;
      --faint: #748394;
      --line: #2b3947;
      --accent: #69a9ff;
      --accent-soft: #1d3550;
      --shadow: 0 10px 32px rgba(0, 0, 0, 0.18);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 88% 5%, rgba(23, 105, 210, 0.08), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button, input { font: inherit; }

    a { color: inherit; }

    .shell {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .site-header {
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--accent);
      font-weight: 750;
      letter-spacing: -0.06em;
    }

    .brand-copy { min-width: 0; }

    .brand-copy strong,
    .brand-copy small {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-copy strong { font-size: 15px; }
    .brand-copy small { color: var(--muted); font-size: 11px; letter-spacing: 0.05em; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .time {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    main { padding: 54px 0 60px; }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 28px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .lead {
      max-width: 680px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.6vw, 18px);
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
      padding: 9px 0;
    }

    .home-link:hover { text-decoration: underline; text-underline-offset: 4px; }

    .toolbar {
      padding: 28px 0 22px;
      display: grid;
      gap: 15px;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--faint);
      pointer-events: none;
    }

    #search {
      width: 100%;
      min-height: 48px;
      padding: 11px 48px 11px 43px;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    #search:focus { border-color: var(--accent); }

    .shortcut {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid var(--line);
      color: var(--faint);
      background: var(--panel-soft);
      padding: 1px 7px;
      font-size: 12px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 7px 12px;
      cursor: pointer;
    }

    .filter:hover,
    .filter:focus-visible,
    .filter.is-active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      outline: none;
    }

    .groups { display: grid; gap: 34px; }

    .group[hidden] { display: none; }

    .group-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .group-heading h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .group-heading span {
      color: var(--faint);
      font-size: 12px;
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .nav-card {
      min-width: 0;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 17px;
      padding: 15px 16px 13px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.02);
      text-decoration: none;
      transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .nav-card:hover,
    .nav-card:focus-visible {
      border-color: color-mix(in srgb, var(--accent) 65%, var(--line));
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      outline: none;
    }

    .card-top {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
    }

    .card-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .card-title {
      min-width: 0;
      padding-top: 4px;
      font-weight: 720;
      line-height: 1.32;
    }

    .arrow { color: var(--faint); font-size: 18px; line-height: 1.4; }
    .nav-card:hover .arrow { color: var(--accent); }

    .card-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .card-description {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-destination {
      flex: 0 0 auto;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }

    .empty {
      display: none;
      padding: 48px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
    }

    .empty.is-visible { display: block; }

    footer {
      padding: 21px 0 34px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 860px) {
      .link-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .intro { grid-template-columns: 1fr; gap: 12px; }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 1120px); }
      .site-header { position: static; }
      .header-inner { min-height: 58px; }
      .brand-copy small, .time { display: none; }
      main { padding: 38px 0 46px; }
      .intro { padding-bottom: 24px; }
      .toolbar { padding-top: 22px; }
      .link-grid { grid-template-columns: 1fr; }
      .nav-card { min-height: 100px; }
      .group-heading { align-items: center; }
      .groups { gap: 29px; }
      .footer-inner { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="https://qiushi0919.cn/" aria-label="返回谢秋实个人主页">
        <span class="brand-mark" aria-hidden="true">Q</span>
        <span class="brand-copy"><strong>谢秋实 · 站点导航</strong><small>QIUSHI0919 · DIRECTORY</small></span>
      </a>
      <div class="header-actions">
        <time class="time" id="clock" aria-label="当前时间"></time>
        <button class="icon-button" id="themeButton" type="button" aria-label="切换深色或浅色主题" title="切换主题">◐</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="intro" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">Website Directory</p>
        <h1 id="pageTitle">站点导航</h1>
        <p class="lead">集中访问个人主页、科研与竞赛项目、服务器工具及互动页面。输入名称即可快速筛选。</p>
      </div>
      <a class="home-link" href="https://qiushi0919.cn/">返回个人主页 <span aria-hidden="true">↗</span></a>
    </section>

    <section class="toolbar" aria-label="搜索与分类筛选">
      <label class="search-wrap" for="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" autocomplete="off" placeholder="搜索站点、项目或工具……">
        <span class="shortcut" aria-hidden="true">/</span>
      </label>
      <div class="filters" id="filters" aria-label="分类">
        <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter" type="button" data-filter="home" aria-pressed="false">主页与作品</button>
        <button class="filter" type="button" data-filter="service" aria-pressed="false">学习与服务</button>
        <button class="filter" type="button" data-filter="tool" aria-pressed="false">服务器工具</button>
        <button class="filter" type="button" data-filter="play" aria-pressed="false">互动与游戏</button>
      </div>
    </section>

    <div class="groups" id="groups" aria-live="polite"></div>
    <p class="empty" id="empty">没有找到匹配的站点，请尝试其他关键词。</p>
  </main>

  <footer>
    <div class="shell footer-inner">
      <span>© 2026 谢秋实 · 个人站点导航</span>
      <span><a href="https://qiushi0919.cn/">qiushi0919.cn</a> · <span id="linkCount">0</span> 个入口</span>
    </div>
  </footer>

  <script>
    (() => {
      const host = window.location.hostname || "qiushi0919.cn";
      const httpHost = `http://${host}`;

      const groups = [
        {
          id: "home",
          title: "主页与作品",
          subtitle: "Profiles & Projects",
          links: [
            { title: "谢秋实 · 个人主页", mark: "XQS", description: "科研论文与竞赛项目作品集", url: "https://qiushi0919.cn/", destination: "主页" },
            { title: "李梓昕 · 个人主页", mark: "LZX", description: "个人简介与科研经历", url: "https://qiushi0919.cn/lzx/", destination: "/lzx/" },
            { title: "智驭低空枢纽", mark: "IC", description: "2026 Intel Cup 无人机地面站", url: "https://qiushi0919.cn/intelcup-2026/", destination: "项目主页" },
            { title: "数字钥匙实验系统", mark: "C", description: "2026 全国大学生电子设计竞赛 C 题", url: "https://qiushi0919.cn/nuedc-c/", destination: "项目主页" },
            { title: "VaseMuseum", mark: "VM", description: "古希腊陶器数字智能博物馆", url: "https://qiushi0919.cn/vasemuseum/", destination: "项目主页" },
            { title: "EECS 2026", mark: "P", description: "锂离子电池剩余寿命预测 · Proc. SPIE 14327", url: "https://doi.org/10.1117/12.3122481", destination: "SPIE 论文" },
            { title: "2025 嵌入式芯片赛", mark: "RA", description: "智能烟雾检测与自适应 AI 阈值", url: "https://qiushi0919.cn/embedded-2025/", destination: "项目页面" }
          ]
        },
        {
          id: "service",
          title: "学习与服务",
          subtitle: "Study & Services",
          links: [
            { title: "保研站", mark: "研", description: "保研信息与资料入口", url: "https://qiushi0919.cn/baoyan/", destination: "/baoyan/" },
            { title: "网站数据统计", mark: "UV", description: "站点访问数据后台", url: "https://qiushi0919.cn/analytics/", destination: "Analytics" }
          ]
        },
        {
          id: "tool",
          title: "服务器工具",
          subtitle: "Server Tools",
          links: [
            { title: "矿业加仓盯盘", mark: "01", description: "行情与仓位辅助工具", url: `${httpHost}:8501/`, destination: ":8501" },
            { title: "示例页面", mark: "02", description: "服务器页面示例", url: `${httpHost}:8502/`, destination: ":8502" },
            { title: "ETF 底部涨幅回测", mark: "08", description: "ETF 策略回测工具", url: `${httpHost}:8508/`, destination: ":8508" },
            { title: "低价盯盘", mark: "09", description: "低价标的监测工具", url: `${httpHost}:8509/`, destination: ":8509" }
          ]
        },
        {
          id: "play",
          title: "互动与游戏",
          subtitle: "Interactive & Games",
          links: [
            { title: "粉丝留言", mark: "MSG", description: "留言与互动页面", url: `${httpHost}:8504/`, destination: ":8504" },
            { title: "VaseMuseum 展示站", mark: "3D", description: "数字博物馆交互演示", url: `${httpHost}:8510/`, destination: ":8510" },
            { title: "贪吃蛇", mark: "S", description: "经典小游戏", url: `${httpHost}:8503/`, destination: ":8503" },
            { title: "打地鼠", mark: "M", description: "反应力小游戏", url: `${httpHost}:8505/`, destination: ":8505" },
            { title: "机场大厨", mark: "C1", description: "经营模拟小游戏", url: `${httpHost}:8506/`, destination: ":8506" },
            { title: "机场大厨 · 新版", mark: "C2", description: "新版经营模拟小游戏", url: `${httpHost}:8507/`, destination: ":8507" }
          ]
        }
      ];

      const groupsEl = document.getElementById("groups");
      const searchEl = document.getElementById("search");
      const emptyEl = document.getElementById("empty");
      const filtersEl = document.getElementById("filters");
      const totalLinks = groups.reduce((count, group) => count + group.links.length, 0);
      let activeFilter = "all";

      document.getElementById("linkCount").textContent = String(totalLinks);

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
        })[character]);
      }

      function render() {
        const query = searchEl.value.trim().toLocaleLowerCase("zh-CN");
        let visibleLinks = 0;

        groupsEl.innerHTML = groups.map(group => {
          if (activeFilter !== "all" && group.id !== activeFilter) return "";

          const links = group.links.filter(link => {
            const haystack = `${link.title} ${link.description} ${group.title} ${group.subtitle}`.toLocaleLowerCase("zh-CN");
            return !query || haystack.includes(query);
          });

          if (!links.length) return "";
          visibleLinks += links.length;

          return `
            <section class="group" data-group="${escapeHtml(group.id)}">
              <div class="group-heading">
                <h2>${escapeHtml(group.title)}</h2>
                <span>${escapeHtml(group.subtitle)} · ${links.length}</span>
              </div>
              <div class="link-grid">
                ${links.map(link => `
                  <a class="nav-card" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">
                    <span class="card-top">
                      <span class="card-mark" aria-hidden="true">${escapeHtml(link.mark)}</span>
                      <span class="card-title">${escapeHtml(link.title)}</span>
                      <span class="arrow" aria-hidden="true">↗</span>
                    </span>
                    <span class="card-bottom">
                      <span class="card-description">${escapeHtml(link.description)}</span>
                      <span class="card-destination">${escapeHtml(link.destination)}</span>
                    </span>
                  </a>
                `).join("")}
              </div>
            </section>
          `;
        }).join("");

        emptyEl.classList.toggle("is-visible", visibleLinks === 0);
      }

      filtersEl.addEventListener("click", event => {
        const button = event.target.closest("[data-filter]");
        if (!button) return;
        activeFilter = button.dataset.filter;
        filtersEl.querySelectorAll("[data-filter]").forEach(item => {
          const active = item === button;
          item.classList.toggle("is-active", active);
          item.setAttribute("aria-pressed", String(active));
        });
        render();
      });

      searchEl.addEventListener("input", render);
      document.addEventListener("keydown", event => {
        if (event.key === "/" && document.activeElement !== searchEl) {
          event.preventDefault();
          searchEl.focus();
        }
        if (event.key === "Escape" && document.activeElement === searchEl) {
          searchEl.value = "";
          searchEl.blur();
          render();
        }
      });

      const root = document.documentElement;
      const themeButton = document.getElementById("themeButton");
      const storedTheme = localStorage.getItem("nav-theme");
      const initialTheme = storedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      root.dataset.theme = initialTheme;

      themeButton.addEventListener("click", () => {
        const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = nextTheme;
        localStorage.setItem("nav-theme", nextTheme);
      });

      const clock = document.getElementById("clock");
      function updateClock() {
        const now = new Date();
        clock.dateTime = now.toISOString();
        clock.textContent = now.toLocaleString("zh-CN", {
          month: "2-digit", day: "2-digit", weekday: "short", hour: "2-digit", minute: "2-digit"
        });
      }
      updateClock();
      setInterval(updateClock, 30000);
      render();
    })();
  </script>
</body>
</html>
